[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments.json" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
